name: 12M ₹2L Volume Strength Test

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_12m.py"
      - ".github/workflows/backtest_12m.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas pyarrow requests
      - name: Run 15x volume backtest
        run: |
          sed 's/5.0\*df.vol_ma20/15.0*df.vol_ma20/; s/OUT = "results"/OUT = "results_15x"/' backtest_12m.py > backtest_15x.py
          python backtest_15x.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-12m-2l-15x-results
          path: results_15x/
          if-no-files-found: warn
