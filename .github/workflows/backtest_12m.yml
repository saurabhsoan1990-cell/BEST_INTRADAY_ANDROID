name: 12M Scanner Backtest

on:
  push:
    paths:
      - ".github/workflows/backtest_12m.yml"
      - "backtest_12m.py"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Run 12 month backtest
        run: python backtest_12m.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scanner-backtest-12m
          path: |
            results/
