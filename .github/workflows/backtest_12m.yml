name: 12M ₹2L Sequential Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_12m.py"
      - ".github/workflows/backtest_12m.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas pyarrow requests
      - name: Run 12M ₹2L backtest
        run: python backtest_12m.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-12m-2l-results
          path: results/
          if-no-files-found: warn
