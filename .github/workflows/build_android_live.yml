name: Build Android Upstox 6x Live APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build_android_live.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Zipalign and sign APK for Android 11+
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="app/build/outputs/apk/debug/app-debug.apk"
          APK_ALIGNED="app-debug-aligned.apk"
          APK_OUT="app-debug-signed.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" "$APK_ALIGNED"
          keytool -genkeypair -keystore build-signing.jks -storepass changeit -keypass changeit -alias bestintraday -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Best Intraday,O=Best Intraday,OU=Trading"
          "$BUILD_TOOLS/apksigner" sign --ks build-signing.jks --ks-pass pass:changeit --key-pass pass:changeit --v1-signing-enabled true --v2-signing-enabled true --out "$APK_OUT" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_OUT"
          mv "$APK_OUT" "$APK_IN"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: best-intraday-upstox-6x-live-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
