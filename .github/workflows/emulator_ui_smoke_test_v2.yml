name: Android Emulator UI Smoke Test v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cpu-checker
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm "$USER" || true
          ls -l /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run app on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.bestintraday
            adb shell monkey -p com.bestintraday 1
            sleep 20
            echo '--- ACTIVITY ---'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|mCurrentFocus' || true
            echo '--- SCREENSHOT ---'
            adb exec-out screencap -p > /tmp/best-intraday-ui.png
            echo '--- UI HIERARCHY ---'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -E 'BEST INTRADAY|DASHBOARD|SETTINGS|ENGINE STATUS|AVAILABLE|TODAY P' || true
            echo '--- ANR CHECK ---'
            if adb shell dumpsys activity activities | grep -q 'Application Not Responding: com.android.systemui'; then exit 1; fi

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: best-intraday-emulator-ui-v2
          path: /tmp/best-intraday-ui.png
          if-no-files-found: error
