name: Android Emulator UI Smoke Test v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cpu-checker
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          kvm-ok || true
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run functional + performance UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 3; done
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.bestintraday
            adb shell monkey -p com.bestintraday 1

            echo '--- WAIT FOR APP ---'
            i=0
            until adb shell dumpsys activity activities | grep -q 'com.bestintraday/.MainActivity'; do
              i=$((i + 1))
              [ "$i" -ge 60 ] && break
              sleep 2
            done
            [ "$i" -lt 60 ] || { adb logcat -d -b all -v time > /tmp/best-intraday-logcat.txt || true; echo 'MainActivity did not become resumed'; exit 1; }

            echo '--- ACTIVITY ---'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|mCurrentFocus' || true

            echo '--- ANR CHECK ---'
            anr_line="$(adb shell dumpsys activity activities | grep -E 'Application Not Responding: com\.bestintraday' || true)"
            [ -z "$anr_line" ] || { adb exec-out screencap -p > /tmp/best-intraday-anr.png || true; adb logcat -d -b all -v time > /tmp/best-intraday-logcat.txt || true; echo 'Best Intraday ANR detected'; exit 1; }

            echo '--- UI SCREENSHOT ---'
            adb exec-out screencap -p > /tmp/best-intraday-ui.png
            test -s /tmp/best-intraday-ui.png

            echo '--- UI HIERARCHY ---'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -E 'BEST INTRADAY|DASHBOARD|SETTINGS|ENGINE STATUS|AVAILABLE|TODAY P|OPEN POSITIONS|LIVE MARKET SCAN' > /tmp/ui_matches.txt
            cat /tmp/ui_matches.txt
            test -s /tmp/ui_matches.txt

            echo '--- FRAME PERFORMANCE ---'
            adb shell dumpsys gfxinfo com.bestintraday reset >/dev/null
            sleep 2
            for i in $(seq 1 8); do
              adb shell input swipe 540 1500 540 500 250 || true
              adb shell input swipe 540 500 540 1500 250 || true
            done
            sleep 2
            adb shell dumpsys gfxinfo com.bestintraday > /tmp/gfxinfo.txt
            cat /tmp/gfxinfo.txt

            python3 - <<'PY'
import re
import pathlib
import sys
text = pathlib.Path('/tmp/gfxinfo.txt').read_text(errors='ignore')
jank_match = re.search(r'Janky frames[^:]*:\s*(\d+)', text)
frame_match = re.search(r'Total frames rendered:\s*(\d+)', text)
if not jank_match or not frame_match:
    print('Could not parse gfxinfo frame counters; skipping performance gate.')
    sys.exit(0)
janky = int(jank_match.group(1))
frames = int(frame_match.group(1))
pct = (janky / frames * 100) if frames else 100.0
print(f'frames={frames} janky={janky} jank_pct={pct:.2f}%')
if frames < 30:
    print('Insufficient frame sample; skipping strict jank threshold.')
    sys.exit(0)
if pct > 5.0:
    print('Excessive jank.')
    sys.exit(1)
PY

            echo '--- FINAL APP ANR CHECK ---'
            final_anr="$(adb shell dumpsys activity activities | grep -E 'Application Not Responding: com\.bestintraday' || true)"
            [ -z "$final_anr" ] || { adb exec-out screencap -p > /tmp/best-intraday-anr.png || true; adb logcat -d -b all -v time > /tmp/best-intraday-logcat.txt || true; echo 'Best Intraday ANR detected after UI test'; exit 1; }

            echo 'PERFORMANCE GATE: PASS'

      - name: Upload emulator performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: best-intraday-emulator-performance-v2
          path: |
            /tmp/best-intraday-ui.png
            /tmp/best-intraday-anr.png
            /tmp/best-intraday-logcat.txt
            /tmp/gfxinfo.txt
            /tmp/ui_matches.txt
          if-no-files-found: ignore
