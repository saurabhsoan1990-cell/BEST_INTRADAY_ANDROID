name: Android Emulator UI Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run app on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.bestintraday
            adb shell monkey -p com.bestintraday 1
            sleep 8
            adb exec-out screencap -p > /tmp/best-intraday-ui.png
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|mCurrentFocus' || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -E 'BEST INTRADAY|Dashboard|Open Positions|Today' || true

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: best-intraday-emulator-ui
          path: /tmp/best-intraday-ui.png
          if-no-files-found: error
