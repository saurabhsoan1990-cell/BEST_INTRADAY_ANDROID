name: 12M Scanner Backtest Retry

on:
  push:
    paths:
      - ".github/workflows/backtest_12m_retry.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python backtest_12m.py
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-backtest-12m-retry
          path: results/